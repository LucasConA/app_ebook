<ion-header>
  <ion-toolbar>
    <ion-title>Biblioteca</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!-- Ordenação -->
  <ion-item>
    <ion-label>Ordenar por</ion-label>
<ion-select [(ngModel)]="ordemSelecionada" (ionChange)="ordenarLivros()">
  <ion-select-option value="recente">Mais recente</ion-select-option>
  <ion-select-option value="antigo">Mais antigo</ion-select-option>
  <ion-select-option value="az">Título A-Z</ion-select-option>
  <ion-select-option value="za">Título Z-A</ion-select-option>
</ion-select>
  </ion-item>

  <!-- Grid de livros -->
  <ion-grid>
    <ion-row>

      <ion-col
        size="3"
        size-md="2"
        *ngFor="let livro of livros"
      >

        <div class="livro-container ion-activatable">

          <!-- Capa -->
          <div
            class="capa-wrapper"
            (click)="abrirDetalhes(livro)"
          >
            <img
              [src]="livro.capa || 'assets/placeholder-book.jpg'"
              class="capa-livro"
            />
          </div>

          <!-- Título -->
          <div class="titulo-livro">
            {{ livro.titulo }}
          </div>

          <!-- Botão remover -->
          <ion-icon
            name="trash"
            class="delete-icon"
            (click)="removerLivro(livro.id); $event.stopPropagation()"
          >
          </ion-icon>

        </div>

      </ion-col>

    </ion-row>
  </ion-grid>

</ion-content>
