<ion-header>
  <ion-toolbar>
    <ion-title>Biblioteca Batatinha</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-list *ngIf="livros.length > 0">
    <ion-item *ngFor="let livro of livros">
      <ion-label>
        <h2>{{ livro.titulo }}</h2>
        <p>{{ livro.autor }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <div *ngIf="livros.length === 0" style="text-align:center; margin-top: 40px;">
    Nenhum livro cadastrado
  </div>

</ion-content>
