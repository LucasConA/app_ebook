<ion-grid>
  <ion-row>

    <ion-col 
      size="6" 
      size-sm="4" 
      size-md="3"
      *ngFor="let livro of livros">

      <div class="livro-container">

        

        <div class="capa-wrapper" (click)="abrirDetalhes(livro)">
          <img 
            [src]="livro.capa || 'assets/placeholder-book.jpg'"
            class="capa-livro"
          />
        </div>

        <div class="titulo-livro">
          {{ livro.titulo }}
        </div>

        <ion-icon
          name="trash"
          class="delete-icon"
          (click)="removerLivro(livro.id); $event.stopPropagation()">
        </ion-icon>
      </div>
      

    </ion-col>

  </ion-row>
</ion-grid>
