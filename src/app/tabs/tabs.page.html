<ion-tabs>

  <ion-tab-bar slot="bottom">

    <ion-tab-button tab="tab1" href="/tab1">
      <ion-icon name="add-outline"></ion-icon>
      <ion-label>Adicionar</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tab2">
      <ion-icon name="library-outline"></ion-icon>
      <ion-label>Biblioteca Batatinha</ion-label>
    </ion-tab-button>

  <ion-tab-button (click)="toggleTheme()">
    <ion-icon [name]="isDark ? 'sunny-outline' : 'moon-outline'"></ion-icon>
    <ion-label>{{ isDark ? 'Light' : 'Dark' }}</ion-label>
  </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
